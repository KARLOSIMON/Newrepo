name: PP-MAP one bigger house v8

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_one_house_v8_big.py"
      - "scripts/build_pp_map_001_lab.py"
      - "scripts/otsp_humanoid_generator.py"
      - "scripts/extract_otb_item_client_ids.py"
      - ".github/workflows/pp-map-one-house-v8-big.yml"

permissions:
  contents: read

jobs:
  house:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned OTSP corpus
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/peonso/opentibia_sprite_pack.git .work/otsp-source
          git -C .work/otsp-source fetch --depth 1 origin ae88e1828671b349e729dd21177dde15ea41e123
          git -C .work/otsp-source checkout --detach ae88e1828671b349e729dd21177dde15ea41e123
      - name: Install renderer dependency
        run: python3 -m pip install --disable-pip-version-check --quiet pillow==11.3.0
      - name: Build one house v7
        run: python3 scripts/build_one_house_v8_big.py --otsp .work/otsp-source --out .work/one-house-v8-big
      - name: Upload house
        uses: actions/upload-artifact@v4
        with:
          name: pp-map-one-house-v8-big
          path: .work/one-house-v8-big/
          if-no-files-found: error
          retention-days: 14
