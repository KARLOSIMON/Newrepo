name: PP-MAP one house facade candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/render_one_house_family_candidates.py"
      - "scripts/build_pp_map_001_lab.py"
      - "scripts/otsp_humanoid_generator.py"
      - "scripts/extract_otb_item_client_ids.py"
      - ".github/workflows/pp-map-one-house-facade-candidates.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned OTSP corpus
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/peonso/opentibia_sprite_pack.git .work/otsp-source
          git -C .work/otsp-source fetch --depth 1 origin ae88e1828671b349e729dd21177dde15ea41e123
          git -C .work/otsp-source checkout --detach ae88e1828671b349e729dd21177dde15ea41e123
      - name: Install renderer dependency
        run: python3 -m pip install --disable-pip-version-check --quiet pillow==11.3.0
      - name: Render real one-house variants
        run: |
          python3 scripts/render_one_house_family_candidates.py             --otsp .work/otsp-source             --out .work/one-house-family-candidates
      - name: Upload candidates
        uses: actions/upload-artifact@v4
        with:
          name: pp-map-one-house-family-candidates
          path: .work/one-house-family-candidates/
          if-no-files-found: error
          retention-days: 14
