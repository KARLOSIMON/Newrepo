name: PP-MAP house parts atlas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/render_house_parts_atlas.py"
      - "scripts/build_pp_map_001_lab.py"
      - "scripts/otsp_humanoid_generator.py"
      - ".github/workflows/pp-map-house-parts-atlas.yml"

permissions:
  contents: read

jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned OTSP corpus
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/peonso/opentibia_sprite_pack.git .work/otsp-source
          git -C .work/otsp-source fetch --depth 1 origin ae88e1828671b349e729dd21177dde15ea41e123
          git -C .work/otsp-source checkout --detach ae88e1828671b349e729dd21177dde15ea41e123
      - name: Install renderer dependency
        run: python3 -m pip install --disable-pip-version-check --quiet pillow==11.3.0
      - name: Render exact current house parts
        run: python3 scripts/render_house_parts_atlas.py
      - name: Upload house parts atlas
        uses: actions/upload-artifact@v4
        with:
          name: pp-map-house-parts-atlas
          path: .work/house-parts-atlas/
          if-no-files-found: error
          retention-days: 7
